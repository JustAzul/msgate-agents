name: ci

on:
  push:
  pull_request:
  workflow_call:

# The PII scan is the engine's tool, pinned to a commit of the engine's main
# branch: the engine's release tags name its dist builds, which hold no Go
# module. Bump the pin when the tool changes. The plugin tests (claude plugin
# test) are a local gate, run before every push that touches plugin/; CI has
# no Claude Code.
env:
  PIISCAN: github.com/JustAzul/cc-msgate/tools/piiscan@05d04bfd34e829e253f4152e7d81fda2bd40aa5e
  # The engine's v* tags name dist builds, which the checksum database cannot
  # verify as module versions; the commit pin already fixes the code.
  GONOSUMDB: github.com/JustAzul/cc-msgate

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Manifests
        run: scripts/test-manifests.sh
      - name: Dispatch skill
        run: scripts/test-skill.sh
      - name: Dist tree
        run: scripts/test-dist.sh
      - name: Release scripts
        run: scripts/test-release.sh
      - name: PII scan of tracked files
        run: go run "$PIISCAN" --tracked .
      - name: Build dist tree
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/dist"
      - name: PII scan of the dist tree
        run: go run "$PIISCAN" --allowlist testdata/pii-allowlist.txt "$RUNNER_TEMP/dist"
