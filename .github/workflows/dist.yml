name: dist

# Every push to main runs the checks and builds the plugin tree; nothing is
# published by it. A release, a commit that scripts/release-gate.sh accepts,
# publishes in a separate job: the dist build as a single orphan commit, tagged
# v<version>, the GitHub release of that tag, and then the dist branch, which
# the marketplace manifest on main points at, moved to that commit last.
# Publishing is serialized and never cancelled once started. Rerunning a failed
# release run finishes what is missing and moves no tag.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The engine's PII scan, pinned to a commit of the engine's main branch
      # (its release tags name dist builds, which hold no Go module). Bump the
      # pin when the tool changes.
      PIISCAN: github.com/JustAzul/cc-msgate/tools/piiscan@05d04bfd34e829e253f4152e7d81fda2bd40aa5e
      # The engine's v* tags name dist builds, which the checksum database
      # cannot verify as module versions; the commit pin already fixes the code.
      GONOSUMDB: github.com/JustAzul/cc-msgate
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-notes.sh lists the commits since the previous version
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Release gate
        id: gate
        run: |
          set -eu
          sh scripts/release-gate.sh "$GITHUB_SHA" >"$RUNNER_TEMP/gate"
          cat "$RUNNER_TEMP/gate"
          cat "$RUNNER_TEMP/gate" >>"$GITHUB_OUTPUT"
      - name: Manifests
        run: scripts/test-manifests.sh
      - name: Dispatch skill
        run: scripts/test-skill.sh
      - name: Dist tree
        run: scripts/test-dist.sh
      - name: Release scripts
        run: scripts/test-release.sh
      - name: PII scan of tracked files
        run: go run "$PIISCAN" --tracked .
      - name: Build dist tree
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/dist"
      - name: PII scan of the dist tree
        run: go run "$PIISCAN" --allowlist testdata/pii-allowlist.txt "$RUNNER_TEMP/dist"

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, none cancelled. GitHub keeps one waiting run per
    # group, so a third queued release replaces the second; rerun the dropped one.
    concurrency:
      group: dist-publish
      cancel-in-progress: false
    env:
      PIISCAN: github.com/JustAzul/cc-msgate/tools/piiscan@05d04bfd34e829e253f4152e7d81fda2bd40aa5e
      GONOSUMDB: github.com/JustAzul/cc-msgate
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes and the dist ancestry check need the history
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Build dist tree
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/dist"
      - name: PII scan of the dist tree
        run: go run "$PIISCAN" --allowlist testdata/pii-allowlist.txt "$RUNNER_TEMP/dist"
      - name: Publish
        run: sh scripts/publish-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/dist"
